title: rclone-replication-ui
description: Interface web de gestion de réplication de fichiers basée sur rclone
remote_theme: just-the-docs/just-the-docs

# URL canonique (sera utilisée par les liens absolus)
url: https://sixmon.github.io
baseurl: /rclone-replication-webui

# Layout
permalink: pretty
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Aux liens du header
aux_links:
  "GitHub":
    - "https://github.com/SIXMON/rclone-replication-webui"
aux_links_new_tab: true

# Footer
footer_content: 'Documentation pour <a href="https://github.com/SIXMON/rclone-replication-webui">rclone-replication-ui</a> · Produit par <a href="https://sixmon.net">Sixmon</a>'

# Color scheme
color_scheme: dark

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme

# Exclusions
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
